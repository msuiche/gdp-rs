name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --lib --test runtime --examples
      - run: cargo test --doc
      - run: cargo build --no-default-features
      - run: cargo build --no-default-features --features alloc
      - run: cargo run --example password_protection
      - run: cargo run --example justified

  # Compiler diagnostics change between releases, so the pinned `.stderr`
  # snapshots are checked against one toolchain. Bump it together with a
  # `TRYBUILD=overwrite cargo +<version> test --test ui` run.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: cargo test --test ui

  axum-example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/axum-basic
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  lean-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check every proof
        working-directory: lean
        run: lake build
      - name: decisions.csv is up to date with the model
        working-directory: lean
        run: |
          lake exe export > decisions.csv
          git diff --exit-code decisions.csv
      - uses: dtolnay/rust-toolchain@stable
      - name: The service matches the model
        working-directory: examples/axum-basic
        run: cargo test --test model

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo test --lib --test runtime --examples
